<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시결 | 시 웹진</title>
    
    <meta name="description" content="시 전문 웹진 시결(SIGYEOL). 신작시, 신인상, 공지사항.">
    <meta name="keywords" content="시, 시결, 웹진, POETRY, SIGYEOL, 문학, 시인">
    <meta name="robots" content="index, follow">

    <!-- Link-share cards (KakaoTalk, social). Per-poem cards live in /p/{id}/ (generated by scripts/build-poems.js). -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="시결">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="시결 | 시 웹진">
    <meta property="og:description" content="정갈한 결을 담아내는 시 전문 웹진 《시결》. 신작시와 신인상 당선작을 만나 보세요.">
    <meta property="og:url" content="https://sigyeol.com/">
    <meta property="og:image" content="https://sigyeol.com/static/og/sigyeol-og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="시결 POETRY WEBZINE 로고">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="시결 | 시 웹진">
    <meta name="twitter:description" content="정갈한 결을 담아내는 시 전문 웹진 《시결》. 신작시와 신인상 당선작을 만나 보세요.">
    <meta name="twitter:image" content="https://sigyeol.com/static/og/sigyeol-og.png">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/favicon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#f3efe8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ========== Folio palette ========== */
        :root {
            --paper: #f3efe8;
            --ink: #141312;
            --muted: #6a655d;
            --rule: #1a1917;
            --hair: #cfc7bb;
            --accent: #2f6b4f;
            --sigyeol-green: #2f6b4f;
            --text-muted: #8a8a8a;
            --serif: 'Noto Serif KR', 'Batang', serif;
            --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            --transition: 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--sans);
            background-color: var(--paper);
            color: var(--ink);
            line-height: 1.6;
            word-break: keep-all;
            overflow-wrap: break-word;
            transition: background-color var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        a:hover { color: var(--accent); }
        button { font-family: inherit; }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 18px 28px 56px;
        }

        .text-btn {
            background: none;
            border: none;
            padding: 0;
            color: inherit;
            font: inherit;
            letter-spacing: inherit;
            text-transform: inherit;
            cursor: pointer;
            transition: color var(--transition);
        }
        .text-btn:hover { color: var(--accent); }

        /* ========== Masthead ========== */
        .mast {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            align-items: flex-end;
            padding: 22px 0 18px;
            border-bottom: 2.5px solid var(--rule);
            transition: border-color var(--transition);
        }
        .logo-lockup { text-align: center; }

        /* Logo: markup, sizes and offsets kept from the original site */
        .site-title-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            color: var(--sigyeol-green);
            font-family: var(--serif);
            line-height: 0.92;
            margin-bottom: 6px;
            transition: opacity var(--transition);
        }
        .site-title-wrapper:hover { opacity: 0.85; }
        /* Logo ~16% larger than the original (2.5/2.7rem); offsets scaled to match */
        .title-char-si {
            font-size: 2.9rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            margin-right: 14px;
        }
        .title-char-gyeol {
            font-size: 3.12rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            margin-left: 9px;
            margin-top: -1px;
        }
        .site-subtitle {
            font-family: var(--serif);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-top: 12px;
            font-weight: 400;
        }

        /* Category nav: serif, readable, large hit area; logo-green underline marks the current page */
        nav.mast-nav { padding-bottom: 2px; }
        nav.mast-nav ul {
            list-style: none;
            display: flex;
            flex-wrap: nowrap;
            gap: 0 6px;
            justify-content: flex-end;
        }
        nav.mast-nav a {
            position: relative;
            display: block;
            padding: 10px 12px 12px;
            font-family: var(--serif);
            font-size: 1.08rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            line-height: 1.2;
            white-space: nowrap;
            color: #3a3732;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: color var(--transition);
        }
        nav.mast-nav li:last-child a { padding-right: 0; }
        nav.mast-nav a::after {
            content: '';
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 4px;
            height: 2px;
            background: var(--sigyeol-green);
            transform: scaleX(0);
            transform-origin: center;
            transition: transform var(--transition);
        }
        nav.mast-nav li:last-child a::after { right: 0; }
        nav.mast-nav a:hover,
        nav.mast-nav a:focus-visible { color: var(--sigyeol-green); }
        nav.mast-nav a:hover::after { transform: scaleX(0.55); }
        nav.mast-nav a.active { color: var(--sigyeol-green); font-weight: 600; }
        nav.mast-nav a.active::after { transform: scaleX(1); }
        nav.mast-nav a:focus-visible { outline: 1px solid var(--sigyeol-green); outline-offset: -2px; }

        /* ========== Main ========== */
        main { min-height: 480px; }

        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ---- Home spread ---- */
        .spread {
            display: grid;
            grid-template-columns: 1.4fr 0.85fr;
            gap: 0 36px;
            align-items: start;
            padding-top: 32px;
        }
        .lead {
            border-right: 1px solid var(--hair);
            padding-right: 32px;
            min-width: 0;
        }
        .lead-title {
            font-family: var(--serif);
            font-size: clamp(1.75rem, 3.1vw, 2.35rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        .lead-author {
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--hair);
        }
            font-size: 0.85rem;
            color: var(--muted);
            font-style: italic;
            padding: 8px 0;
        }
        /* Left column shows the full text with the reading-view styles (.poem-detail-content). */
        .lead-body.poem-detail-content { margin-bottom: 0; min-height: 1.9em; }

        /* Home INDEX list: full height, no inner scroll box, no pagination — the page itself scrolls. */
        .side-col { padding-top: 4px; min-width: 0; }
        @media (min-width: 781px) {
            /* PC: while the list scrolls, keep the left poem in view if it fits the screen
               (class toggled by updateLeadPin; long poems stay in normal flow). */
            .lead.pinned { position: sticky; top: 24px; }
        }
        .toc-item {
            display: block;
            padding: 12px 0;
            border-bottom: 1px solid var(--hair);
            cursor: pointer;
        }
        .toc-cat {
            font-size: 0.62rem;
            letter-spacing: 0.14em;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .toc-title {
            font-family: var(--serif);
            font-size: 1.02rem;
            font-weight: 500;
            line-height: 1.35;
        }
        .toc-author {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: 0.04em;
        }
        .toc-list { border-top: 1px solid var(--rule); }
        .toc-item:hover .toc-title,
        .toc-item.current .toc-title { color: var(--accent); }
        .lead.swap .lead-swap { animation: leadFade 0.22s ease; }
        @keyframes leadFade { from { opacity: 0.35; } to { opacity: 1; } }

        /* ---- Category pages ---- */
        .section-header {
            padding-top: 32px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--rule);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .section-header-title {
            font-family: var(--serif);
            font-size: clamp(1.75rem, 3.2vw, 2.4rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .section-count {
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: var(--muted);
            padding-bottom: 6px;
            white-space: nowrap;
        }

        .idx-row {
            display: grid;
            grid-template-columns: 3.2rem 1fr auto;
            align-items: baseline;
            gap: 0 20px;
            padding: 18px 0;
            border-bottom: 1px solid var(--hair);
            cursor: pointer;
        }
        .idx-num {
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: var(--muted);
        }
        .idx-title {
            font-family: var(--serif);
            font-size: 1.18rem;
            font-weight: 500;
            line-height: 1.4;
            min-width: 0;
        }
        .idx-author {
            font-size: 0.82rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-align: right;
        }
        .idx-row:hover .idx-title { color: var(--accent); }
        .idx-row:hover { color: inherit; }

        .no-result {
            padding: 18px 0;
            font-size: 0.85rem;
            color: var(--muted);
            border-bottom: 1px solid var(--hair);
            font-style: italic;
        }

        /* ---- Search (quiet) ---- */
        .search-container {
            display: none;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--hair);
        }
        .search-container.active { display: flex; }
        .search-select,
        .search-input {
            border: none;
            border-bottom: 1px solid var(--hair);
            background: transparent;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            padding: 6px 2px;
            outline: none;
            border-radius: 0;
            transition: border-color var(--transition);
        }
        .search-select { color: var(--muted); cursor: pointer; }
        .search-select option { background: var(--paper); color: var(--ink); }
        .search-select:focus,
        .search-input:focus { border-bottom-color: var(--ink); }
        .search-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            max-width: 420px;
        }
        .search-input { width: 100%; min-width: 0; }
        .search-input::placeholder { color: var(--muted); opacity: 0.8; }
        .search-btn {
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            color: var(--muted);
            border-bottom: 1px solid var(--muted);
            padding-bottom: 1px;
            white-space: nowrap;
        }
        .search-btn:hover { border-bottom-color: var(--accent); }

        /* ---- Pagination (text) ---- */
        .pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: 28px;
        }
        .pagination:empty { display: none; }
        .page-btn {
            background: none;
            border: none;
            border-bottom: 1px solid transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            padding: 2px 2px 1px;
            cursor: pointer;
            transition: color var(--transition);
        }
        .page-btn:hover:not(:disabled):not(.active) { color: var(--accent); }
        .page-btn.active { color: var(--ink); border-bottom-color: var(--ink); }
        .page-btn:disabled { opacity: 0.3; cursor: default; }

        /* ========== Reading view ========== */
        .poem-detail-container {
            max-width: 660px;
            margin: 0 auto;
            padding: 40px 0 8px;
        }
        .poem-detail-category {
            font-size: 0.64rem;
            letter-spacing: 0.22em;
            color: var(--accent);
            margin-bottom: 14px;
            text-transform: uppercase;
        }
        .poem-detail-title {
            font-family: var(--serif);
            font-size: clamp(1.9rem, 3.4vw, 2.6rem);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        .poem-detail-author {
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 36px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--hair);
        }
        .poem-detail-content {
            font-family: var(--serif);
            font-size: 1.06rem;
            line-height: 1.9;
            white-space: pre-line;
            /* Book-style setting: Korean wraps per syllable (no keep-all gaps) and lines are
               justified to a flush right edge; the last line of each paragraph stays left. */
            word-break: normal;
            line-break: strict;
            overflow-wrap: break-word; /* long latin strings / URLs still break */
            text-align: justify;
            text-align-last: auto;
            color: var(--ink);
            margin-bottom: 44px;
            text-indent: 0.8em;
        }
        /* The editor stores the default alignment as inline "text-align: left" (outer wrapper and
           any line set to 왼쪽). Treat that as the default → justify. Inline center/right are untouched
           and still win, including for lines nested inside a centered/right block (inheritance). */
        .poem-detail-content [style*="text-align: left"],
        .poem-detail-content [style*="text-align:left"] { text-align: justify !important; }
        .poem-detail-content p,
        .poem-detail-content div {
            text-indent: 0.8em;
        }
        .poem-detail-content b, .poem-detail-content strong { font-weight: 700; }
        /* Editor font-size tool (7 levels, relative to the body size): fs-m3…fs-m1 / 기본 / fs-p1…fs-p3 */
        .poem-detail-content .fs-m3 { font-size: 0.8em; }
        .poem-detail-content .fs-m2 { font-size: 0.87em; }
        .poem-detail-content .fs-m1 { font-size: 0.93em; }
        .poem-detail-content .fs-p1 { font-size: 1.12em; }
        .poem-detail-content .fs-p2 { font-size: 1.25em; }
        .poem-detail-content .fs-p3 { font-size: 1.4em; }
        .poem-detail-content a { border-bottom: 1px solid var(--hair); }
        .poem-detail-content img { max-width: 100%; height: auto; }

        .detail-action-btns {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid var(--rule);
        }
        .detail-btn {
            background: none;
            border: none;
            border-bottom: 1px solid var(--rule);
            padding: 0 0 3px;
            font-family: inherit;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            color: var(--ink);
            cursor: pointer;
            transition: color var(--transition), border-color var(--transition);
        }
        .detail-btn:hover { color: var(--accent); border-bottom-color: var(--accent); }

        /* ========== Footer ========== */
        footer.run-foot {
            margin-top: 56px;
            padding-top: 22px;
            border-top: 1px solid var(--rule);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .instagram-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            color: var(--muted);
            transition: color var(--transition);
        }
        .instagram-icon:hover { color: var(--accent); }
        .instagram-icon svg { width: 100%; height: 100%; fill: currentColor; display: block; }
        .copyright {
            font-size: 0.62rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-align: center;
        }

        /* ========== Mobile ========== */
        @media (max-width: 780px) {
            .page { padding: 12px 16px 44px; }
            .mast {
                flex-direction: column;
                align-items: center;
                gap: 16px;
                text-align: center;
                padding-top: 18px;
            }
            nav.mast-nav { width: 100%; padding-bottom: 0; }
            nav.mast-nav ul { justify-content: center; gap: 0 4px; }
            nav.mast-nav a { font-size: 1.02rem; padding: 10px 14px 12px; }
            nav.mast-nav li:last-child a { padding-right: 14px; }
            nav.mast-nav a::after { left: 14px; right: 14px; }
            nav.mast-nav li:last-child a::after { right: 14px; }
            .spread {
                grid-template-columns: 1fr;
                gap: 36px;
                padding-top: 24px;
            }
            /* Mobile home: no random poem preview — just the INDEX list (PC is unchanged). */
            .lead { display: none; }
            .spread { gap: 0; padding-top: 4px; }
            .side-col { padding-top: 0; }
            .toc-list { border-top: none; } /* the masthead rule already opens the list */
            /* Mobile INDEX rows: larger and bolder than PC, roomy tap targets, folio rules kept */
            .toc-item { padding: 20px 2px 19px; }
            .toc-cat { font-size: 0.7rem; letter-spacing: 0.16em; margin-bottom: 7px; }
            .toc-title {
                font-size: 1.34rem;
                font-weight: 600;
                line-height: 1.38;
                letter-spacing: -0.01em;
                word-break: keep-all;
                overflow-wrap: break-word;
            }
            .toc-author { font-size: 0.95rem; margin-top: 7px; letter-spacing: 0.06em; }
            /* No preview on mobile, so no "current" highlight; keep a tap feedback instead */
            .toc-item.current .toc-title { color: inherit; }
            .toc-item:active .toc-title { color: var(--accent); }
            .section-header { padding-top: 24px; }
            .idx-row {
                grid-template-columns: 2.4rem 1fr;
                gap: 2px 12px;
                padding: 14px 0;
            }
            .idx-author { grid-column: 2; text-align: left; }
            .idx-title { font-size: 1.08rem; }
            .search-container { gap: 10px; }
            .poem-detail-container { padding-top: 28px; }
            .poem-detail-title { font-size: 1.75rem; }
            .poem-detail-content { font-size: 1rem; line-height: 1.9; }
            footer.run-foot { margin-top: 44px; }
        }
        @media (max-width: 768px) {
            .title-char-si { font-size: 2.5rem; }
            .title-char-gyeol { font-size: 2.66rem; }
        }
        @media (max-width: 400px) {
            .title-char-si { font-size: 2.26rem; }
            .title-char-gyeol { font-size: 2.43rem; }
        }
    </style>
</head>
<body>
<div class="page">

    <header class="mast">
        <div class="logo-lockup">
            <div class="site-title-wrapper" onclick="reloadHome()">
                <span class="title-char-si">시</span>
                <span class="title-char-gyeol">결</span>
            </div>
            <div class="site-subtitle">POETRY WEBZINE</div>
        </div>
        <nav class="mast-nav" aria-label="분류">
            <ul>
                <li><a onclick="navigateToSection('new-poems')" id="nav-new-poems">신작시</a></li>
                <li><a onclick="navigateToSection('rookie-award')" id="nav-rookie-award">신인상</a></li>
                <li><a onclick="navigateToSection('notice')" id="nav-notice">공지사항</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="search-container" class="search-container">
            <select id="search-type" class="search-select" aria-label="검색 범위" autocomplete="off">
                <option value="all">전체검색</option>
                <option value="title">제목</option>
                <option value="author">작가명</option>
                <option value="content">본문</option>
            </select>
            <div class="search-input-wrapper">
                <input type="text" id="search-keyword" class="search-input" placeholder="검색어" aria-label="검색어" autocomplete="off" onkeyup="if(event.key==='Enter') handleSearch()">
                <button class="text-btn search-btn" onclick="handleSearch()">검색</button>
            </div>
        </div>

        <!-- Home: folio spread -->
        <section id="section-main" class="page-section active">
            <div class="spread">
                <article class="lead" id="featured">
                    <div class="lead-swap">
                        <h1 class="lead-title"><a id="featured-title" href="./"></a></h1>
                        <div class="lead-author" id="featured-author"></div>
                        <div class="lead-body poem-detail-content" id="featured-body"></div>
                    </div>
                </article>
                <aside class="side-col">
                    <div id="grid-main" class="poetry-grid toc-list"></div>
                    <div id="pagination-main" class="pagination"></div>
                </aside>
            </div>
        </section>

        <!-- Category pages -->
        <section id="section-new-poems" class="page-section"><div class="section-header"><div><h1 class="section-header-title">신작시</h1></div><div class="section-count" id="count-new-poems"></div></div><div id="grid-new-poems" class="poetry-grid idx-list"></div><div id="pagination-new-poems" class="pagination"></div></section>
        <section id="section-rookie-award" class="page-section"><div class="section-header"><div><h1 class="section-header-title">신인상</h1></div><div class="section-count" id="count-rookie-award"></div></div><div id="grid-rookie-award" class="poetry-grid idx-list"></div><div id="pagination-rookie-award" class="pagination"></div></section>
        <section id="section-notice" class="page-section"><div class="section-header"><div><h1 class="section-header-title">공지사항</h1></div><div class="section-count" id="count-notice"></div></div><div id="grid-notice" class="poetry-grid idx-list"></div><div id="pagination-notice" class="pagination"></div></section>

        <!-- Reading view -->
        <section id="section-poem-detail" class="page-section">
            <article class="poem-detail-container">
                <div id="detail-category" class="poem-detail-category">카테고리</div>
                <h1 id="detail-title" class="poem-detail-title">제목</h1>
                <div id="detail-author" class="poem-detail-author">작가</div>
                <div id="detail-content" class="poem-detail-content">본문</div>

                <div class="detail-action-btns">
                    <button class="detail-btn" onclick="goBack()">돌아가기</button>
                    <button id="copy-link-btn" class="detail-btn" onclick="copyCurrentLink()">링크 복사</button>
                </div>
            </article>
        </section>
    </main>

    <footer class="run-foot">
            <a href="https://www.instagram.com/sigyeol/" target="_blank" rel="noopener noreferrer" class="instagram-icon" aria-label="시결 인스타그램">

</div>

    <script src="poems-index.js"></script>
    <script>
        // Index is metadata only (no HTML body). Bodies load from poems/{id}.json on open.
        // Search: title/author/category from index (fast). "본문" searches bodies after
        // lazy-loading them; "전체검색" stays metadata-only (body full-text is optional later).
        let currentPoems = typeof poems !== 'undefined' ? poems.map(p => ({ ...p })) : [];
        let currentSection = 'main', previousSection = 'main';
        const bodyFetchCache = new Map(); // id -> Promise<item> or resolved item with content
        let bodySearchReady = false;
        let bodySearchLoading = null;

        const ITEMS_PER_PAGE = 20, PAGES_PER_BLOCK = 10;
        let pageStates = { 'main': 1, '신작시': 1, '신인상': 1, '공지사항': 1 };

        const SECTION_IDS = { 'main': 'main', '신작시': 'new-poems', '신인상': 'rookie-award', '공지사항': 'notice' };
        const FEATURED_POOL = ['신작시', '신인상']; // never 공지사항

        // Share URL: /p/{id}/ is a small static page (built per poem) that carries the poem's
        // Open Graph card for KakaoTalk/social crawlers and then opens /?id={id} for readers.
        function shareUrlForCurrent() {
            const id = new URLSearchParams(window.location.search).get('id');
            return id ? window.location.origin + '/p/' + encodeURIComponent(id) + '/' : window.location.href;
        }
        function copyCurrentLink() {
            navigator.clipboard.writeText(shareUrlForCurrent()).then(() => {
                alert('게시글 주소가 복사되었습니다.');
            }).catch(() => {
                alert('주소 복사에 실패했습니다. 브라우저 주소창을 직접 복사해 주세요.');
            });
        }

        function ensurePoemBody(id) {
            const item = currentPoems.find(p => p.id == id);
            if (!item) return Promise.resolve(null);
            if (item.content != null) return Promise.resolve(item);
            if (bodyFetchCache.has(id)) return bodyFetchCache.get(id);
            // Versioned URL (v = content hash from the build): an edited body gets a new URL,
            // so a copy cached before the edit can never be shown. Without v, always revalidate.
            const url = 'poems/' + id + '.json' + (item.v ? '?v=' + encodeURIComponent(item.v) : '');
            const promise = fetch(url, { cache: item.v ? 'default' : 'no-cache' })
                .then(res => {
                    if (!res.ok) throw new Error('body ' + res.status);
                    return res.json();
                })
                .then(data => {
                    item.content = data && data.content != null ? data.content : '';
                    return item;
                })
                .catch(err => {
                    bodyFetchCache.delete(id);
                    throw err;
                });
            bodyFetchCache.set(id, promise);
            return promise;
        }

        function ensureAllBodiesForSearch() {
            if (bodySearchReady) return Promise.resolve();
            if (bodySearchLoading) return bodySearchLoading;
            bodySearchLoading = Promise.all(
                currentPoems.map(p => ensurePoemBody(p.id).catch(() => null))
            ).then(() => {
                bodySearchReady = true;
                bodySearchLoading = null;
            });
            return bodySearchLoading;
        }

        const getSortedPoems = arr => [...arr].sort((a, b) => {
            const ao = a.order == null || a.order === '' ? Number.POSITIVE_INFINITY : parseFloat(a.order);
            const bo = b.order == null || b.order === '' ? Number.POSITIVE_INFINITY : parseFloat(b.order);
            if (ao !== bo) return ao - bo; // lower order = first
            return Number(b.id) - Number(a.id);
        });

        // Home INDEX order is independent of the category 'order':
        // mainOrder ascending (lower = higher up); posts without mainOrder go last; ties → newest id first.
        const parseMainOrder = v => (v == null || v === '' || !Number.isFinite(parseFloat(v))) ? null : parseFloat(v);
        function getMainListPoems(list) {
            return list.filter(p => p.isMain).sort((a, b) => {
                const am = parseMainOrder(a.mainOrder), bm = parseMainOrder(b.mainOrder);
                if (am != null && bm != null && am !== bm) return am - bm;
                if (am == null && bm != null) return 1;
                if (am != null && bm == null) return -1;
                return Number(b.id) - Number(a.id);
            });
        }

        function matchesSearch(p, type, kw) {
            const t = (p.title || '').toLowerCase();
            const a = (p.author || '').toLowerCase();
            const cat = (p.category || '').toLowerCase();
            if (type === 'title') return t.includes(kw);
            if (type === 'author') return a.includes(kw);
            if (type === 'content') {
                const c = (p.content || '').toLowerCase();
                return c.includes(kw);
            }
            // 전체검색: metadata only (title / author / category). Body full-text → use 본문.
            return t.includes(kw) || a.includes(kw) || cat.includes(kw);
        }

        async function handleSearch() {
            pageStates[currentSection] = 1;
            const type = document.getElementById('search-type').value;
            const kw = document.getElementById('search-keyword').value.trim();
            if (kw && type === 'content' && !bodySearchReady) {
                const gridHint = document.querySelector('.page-section.active .poetry-grid');
                if (gridHint) gridHint.innerHTML = '<div class="no-result">본문 검색을 준비하는 중…</div>';
                try {
                    await ensureAllBodiesForSearch();
                } catch (e) { /* partial results ok */ }
            }
            renderData();
        }

        // ---------- small DOM helpers (text only, never raw HTML from data) ----------
        function el(tag, className, text) {
            const n = document.createElement(tag);
            if (className) n.className = className;
            if (text != null) n.textContent = text;
            return n;
        }
        function poemHref(id) { return '?id=' + encodeURIComponent(id); }
        function bindOpen(node, id) {
            node.href = poemHref(id);
            node.onclick = e => {
                if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; // allow new tab
                e.preventDefault();
                navigateToPoemDetail(String(id));
            };
        }
        function emptyLine(cat) {
            return cat === '공지사항' ? '공지사항 — 게시 예정' : cat + ' — 수록 예정';
        }

        // Home index row: category label / title / poet
        function makeTocItem(item) {
            const a = el('a', 'toc-item');
            a.appendChild(el('div', 'toc-cat', item.category));
            a.appendChild(el('div', 'toc-title', item.title));
            a.appendChild(el('div', 'toc-author', item.author));
            a.dataset.id = item.id;
            if (item.id == featuredId) a.classList.add('current');
            bindOpen(a, item.id);
            a.addEventListener('mouseenter', () => onRowHover(item));
            return a;
        }
        // Category page row: number / title / poet
        function makeIdxRow(item, num) {
            const a = el('a', 'idx-row');
            a.appendChild(el('span', 'idx-num', String(num).padStart(2, '0')));
            a.appendChild(el('span', 'idx-title', item.title));
            a.appendChild(el('span', 'idx-author', item.author));
            bindOpen(a, item.id);
            return a;
        }

        // Featured poem: picked at random once per page load from the isMain posts (fallback: 신작시 / 신인상).
        // The left column shows the full body (same HTML + styles as the reading view).
        // Pool = the posts shown in the right-hand list (isMain === true, any category).
        // If none are flagged, fall back to all 신작시 / 신인상 posts.
        function pickRandomFeatured() {
            const mainPool = currentPoems.filter(p => p.isMain === true);
            const pool = mainPool.length ? mainPool : currentPoems.filter(p => FEATURED_POOL.includes(p.category));
            if (pool.length === 0) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // The left preview exists only on the PC layout (the CSS hides .lead at ≤780px).
        const leadMQ = window.matchMedia('(min-width: 781px)');
        let featuredItem = pickRandomFeatured();
        let featuredId = null;      // id currently rendered on the left
        let featuredToken = 0;      // only the latest request may render (hover races)

        function showFeatured(item, animate) {
            const lead = document.getElementById('featured');
            const titleEl = document.getElementById('featured-title');
            const authorEl = document.getElementById('featured-author');
            const body = document.getElementById('featured-body');
            const token = ++featuredToken;
            if (!item) {
                featuredId = null;
                titleEl.textContent = '';
                authorEl.textContent = '';
                body.textContent = '';
                return;
            }
            const changed = featuredId !== item.id;
            featuredId = item.id;
            featuredItem = item;
            titleEl.textContent = item.title;
            authorEl.textContent = item.author;
            bindOpen(titleEl, item.id);
            document.querySelectorAll('#grid-main .toc-item').forEach(a => a.classList.toggle('current', a.dataset.id == item.id));
            if (changed && animate) {
                lead.classList.remove('swap');
                void lead.offsetWidth; // restart the short fade
                lead.classList.add('swap');
                // No auto-scroll here: the list is no longer a sticky box, so moving the page
                // would slide rows under the cursor. A poem that fits the screen is pinned instead.
            }
            if (item.content != null) { body.innerHTML = item.content; return; }
            if (changed) body.textContent = '';
            // Mobile hides the preview: don't download its body until the layout becomes PC (see leadMQ).
            if (!leadMQ.matches) return;
            ensurePoemBody(item.id).then(loaded => {
                if (token !== featuredToken || !loaded) return; // a newer hover won
                body.innerHTML = loaded.content || '';
            }).catch(() => {
                if (token !== featuredToken) return;
                body.innerHTML = '<div class="no-result">본문을 불러오지 못했습니다.</div>';
            });
        }

        // PC hover preview: hovering a list row swaps the left poem (mouse + wide screens only).
        const hoverPreviewMQ = window.matchMedia('(hover: hover) and (min-width: 900px)');
        let hoverTimer = null, listPrefetched = false;
        function prefetchListedBodies() {
            if (listPrefetched) return;
            listPrefetched = true;
            getMainListPoems(currentPoems).slice(0, ITEMS_PER_PAGE).forEach(p => ensurePoemBody(p.id).catch(() => null));
        }
        function onRowHover(item) {
            if (!hoverPreviewMQ.matches) return;
            prefetchListedBodies();
            clearTimeout(hoverTimer);
            hoverTimer = setTimeout(() => {
                if (featuredId !== item.id) showFeatured(item, true);
            }, 70);
        }
        // PC: pin the left poem (sticky) only when it fits in the viewport; a taller sticky box would cut it off.
        function updateLeadPin() {
            const lead = document.getElementById('featured');
            if (!lead) return;
            const fits = window.matchMedia('(min-width: 781px)').matches &&
                lead.offsetHeight <= window.innerHeight - 48;
            lead.classList.toggle('pinned', fits);
        }
        if ('ResizeObserver' in window) {
            new ResizeObserver(updateLeadPin).observe(document.getElementById('featured'));
        }
        window.addEventListener('resize', updateLeadPin);
        // Mobile → PC (rotate/resize): fill in the preview body that was skipped on mobile.
        leadMQ.addEventListener('change', e => {
            if (e.matches && featuredItem) showFeatured(featuredItem, false);
        });

        function schedulePrefetch() {
            if (!hoverPreviewMQ.matches) return;
            const run = () => prefetchListedBodies();
            if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 3000 });
            else setTimeout(run, 1500);
        }

        function renderData() {
            const type = document.getElementById('search-type').value;
            const kw = document.getElementById('search-keyword').value.trim().toLowerCase();
            const sorted = getSortedPoems(currentPoems);
            let filtered = sorted;

            if (kw) {
                filtered = filtered.filter(p => matchesSearch(p, type, kw));
            }


            Object.keys(SECTION_IDS).forEach(cat => {
                const gridId = 'grid-' + SECTION_IDS[cat];
                const pageId = 'pagination-' + SECTION_IDS[cat];
                
                const grid = document.getElementById(gridId);
                const page = document.getElementById(pageId);
                if (!grid) return;
                grid.innerHTML = ''; page.innerHTML = '';

                // Home list: only posts flagged '메인 페이지 노출' (isMain), ordered by '메인 페이지 노출 순서' (mainOrder).
                const items = cat === 'main' ? getMainListPoems(sorted) : filtered.filter(p => p.category === cat);

                if (cat !== 'main') {
                    const total = sorted.filter(p => p.category === cat).length;
                    const countEl = document.getElementById('count-' + SECTION_IDS[cat]);
                    if (countEl) {
                        const unit = cat === '공지사항' ? '건' : '편';
                        countEl.textContent = kw ? (items.length + ' / ' + total + unit) : (total ? total + unit : '');
                    }
                }

                if (items.length === 0) {
                    if (cat === 'main') {
                        // nothing flagged for the main page: leave the list empty
                    } else if (kw) {
                        grid.appendChild(el('div', 'no-result', '검색 결과가 없습니다.'));
                    } else {
                        grid.appendChild(el('div', 'no-result', emptyLine(cat)));
                    }
                    return;
                }

                // Home list shows every isMain post on one page (no pagination); categories paginate.
                const perPage = cat === 'main' ? Math.max(items.length, 1) : ITEMS_PER_PAGE;
                const totalPages = Math.ceil(items.length / perPage);
                if (pageStates[cat] > totalPages) pageStates[cat] = totalPages;
                const curPage = pageStates[cat] || 1;
                const offset = (curPage - 1) * perPage;
                const pagedItems = items.slice(offset, curPage * perPage);

                // Category numbers count in upload order: the oldest post (bottom of the list) is 01,
                // the newest (top) gets the highest number. Numbers come from the full category list,
                // so a post keeps its number while searching.
                const fullCat = cat === 'main' ? [] : sorted.filter(p => p.category === cat);
                const numOf = item => fullCat.length - fullCat.indexOf(item);
                pagedItems.forEach(item => {
                    grid.appendChild(cat === 'main' ? makeTocItem(item) : makeIdxRow(item, numOf(item)));
                });

                if (totalPages > 1 && page) {
                    const start = (Math.ceil(curPage / PAGES_PER_BLOCK) - 1) * PAGES_PER_BLOCK + 1;
                    const end = Math.min(start + PAGES_PER_BLOCK - 1, totalPages);

                    const createBtn = (label, disabled, onClick, aria) => {
                        const b = document.createElement('button');
                        b.className = 'page-btn'; b.textContent = label; b.disabled = disabled;
                        if (aria) b.setAttribute('aria-label', aria);
                        b.onclick = onClick; return b;
                    };
                    const go = n => { pageStates[cat] = n; renderData(); window.scrollTo({ top: grid.offsetTop - 100, behavior: 'smooth' }); };

                    page.appendChild(createBtn('이전', curPage === 1, () => go(curPage - 1), '이전 페이지'));
                    for (let i = start; i <= end; i++) {
                        const btn = createBtn(String(i), false, () => go(i));
                        if (i === curPage) btn.classList.add('active');
                        page.appendChild(btn);
                    }
                    page.appendChild(createBtn('다음', curPage === totalPages, () => go(curPage + 1), '다음 페이지'));
                }
            });
        }

        function navigateToSection(secId, pushHistory = true) {
            if (pushHistory) {
                history.pushState({ section: secId }, '', window.location.pathname);
            }
            showSection(secId);
        }

        function navigateToPoemDetail(id, pushHistory = true) {
            if (pushHistory) {
                history.pushState({ poemId: id }, '', '?id=' + id);
            }
            showPoemDetail(id);
        }

        window.addEventListener('popstate', function(e) {
            const params = new URLSearchParams(window.location.search);
            const poemId = params.get('id');

            if (poemId) {
                showPoemDetail(poemId);
            } else if (e.state && e.state.section) {
                showSection(e.state.section);
            } else {
                showSection('main');
            }
        });

        // Search is per visit: any navigation (section change, home, poem open/return, back/forward) clears it.
        function resetSearch() {
            const kwEl = document.getElementById('search-keyword');
            const typeEl = document.getElementById('search-type');
            if (kwEl) kwEl.value = '';
            if (typeEl) typeEl.value = 'all';
        }

        // Logo: real reload of the main page so the random poem re-rolls.
        function reloadHome() {
            window.location.href = '/';
        }

        function showSection(secId) {
            if (!document.getElementById('section-' + secId)) secId = 'main';
            resetSearch();
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav a').forEach(l => l.classList.remove('active'));
            const target = document.getElementById('section-' + secId), nav = document.getElementById('nav-' + secId);
            if (target) target.classList.add('active');
            if (nav) nav.classList.add('active');

            const search = document.getElementById('search-container');
            const showSearch = secId !== 'main' && secId !== 'poem-detail';
            if (showSearch && target) {
                const header = target.querySelector('.section-header');
                if (header && header.nextElementSibling !== search) header.after(search);
            }
            search.classList.toggle('active', showSearch);

            if (secId !== 'poem-detail') { currentSection = secId; previousSection = secId; }
            window.scrollTo({ top: 0, behavior: 'smooth' }); renderData();
        }

        function showPoemDetail(id) {
            const item = currentPoems.find(p => p.id == id);
            if (!item) return;

            document.getElementById('detail-category').innerText = item.category;
            document.getElementById('detail-title').innerText = item.title;
            document.getElementById('detail-author').innerText = item.author;
            document.getElementById('detail-content').innerHTML = item.content != null
                ? item.content
                : '<div class="no-result">불러오는 중…</div>';

            const copyBtn = document.getElementById('copy-link-btn');
            if (copyBtn) {
                copyBtn.style.display = 'inline-block';
            }

            showSection('poem-detail');
            const catNav = document.getElementById('nav-' + SECTION_IDS[item.category]);
            if (catNav) catNav.classList.add('active');

            if (item.content == null) {
                ensurePoemBody(id).then(loaded => {
                    const still = new URLSearchParams(window.location.search).get('id');
                    if (still != id) return; // navigated away
                    if (!loaded) {
                        document.getElementById('detail-content').innerHTML = '<div class="no-result">본문을 불러오지 못했습니다.</div>';
                        return;
                    }
                    document.getElementById('detail-content').innerHTML = loaded.content || '';
                }).catch(() => {
                    const still = new URLSearchParams(window.location.search).get('id');
                    if (still != id) return;
                    document.getElementById('detail-content').innerHTML = '<div class="no-result">본문을 불러오지 못했습니다.</div>';
                });
            }
        }

        function goBack() { 
            if (window.history.length > 1) {
                window.history.back();
            } else {
                navigateToSection(previousSection);
            }
        }

        function initApp() {
            resetSearch(); // browsers may restore old form values on reload/back
            const params = new URLSearchParams(window.location.search);
            const poemId = params.get('id');
            if (poemId) {
                showPoemDetail(poemId);
            } else {
                renderData();
            }
        }

        window.addEventListener('pageshow', e => { if (e.persisted) { resetSearch(); renderData(); } });

        showFeatured(featuredItem, false);
        initApp();
        schedulePrefetch();
    </script>
