# Decap CMS — 시결 (sigyeol.com)
# 로그인: Netlify Identity + Git Gateway (Netlify 대시보드에서 활성화 필요)
# 대안: 아래 backend를 github로 바꿀 수 있음 (repo: sigyeol2024/sigyeol, branch: main)

backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: static/media
public_folder: /static/media

# 바로 발행 (editorial workflow 끔)

collections:
  - name: poems
    label: 시·공지
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}} ({{category}})"
    # 목록 화면에서 order로 정렬 가능. 폴더 컬렉션은 드래그로 order를 자동 저장하지 않음 → 숫자 필드 사용.
    sortable_fields: ["order", "id", "title", "author", "category"]
    fields:
      - label: ID
        name: id
        widget: number
        value_type: int
        hint: "새 글은 브라우저 콘솔에서 Date.now() 값을 넣어 주세요. (파일명·고유키용; 표시 순서는 아래 '표시 순서' 필드를 씁니다.)"
      - label: 표시 순서
        name: order
        widget: number
        value_type: int
        default: 1
        hint: "숫자가 작을수록 목록 위쪽에 표시됩니다. (1이 맨 위) 같은 숫자면 ID가 큰 글이 위에 옵니다. 순서를 바꾸려면 이 숫자만 고친 뒤 Publish 하세요."
      - label: 카테고리
        name: category
        widget: select
        options:
          - 신작시
          - 주목한 시
          - 신인상
          - 공지사항
          - 아카이브
        default: 신작시
      - label: 제목
        name: title
        widget: string
      - label: 작가명
        name: author
        widget: string
        default: ""
      - label: 메인 페이지 노출
        name: isMain
        widget: boolean
        default: false
      - label: 본문
        name: content
        widget: poem-html
        hint: "도구모음: 굵게·기울임·밑줄·취소선·좌/중/우 정렬 (+ 밝은/어두운 배경 미리보기). Enter로 줄바꿈, 빈 줄은 Enter를 한 번 더. 편집 화면은 시결 본문 보기와 비슷한 서체·여백이며 HTML로 저장됩니다."
