# Decap CMS — 시결 (sigyeol.com)
# 로그인: Netlify Identity + Git Gateway (Netlify 대시보드에서 활성화 필요)
# 대안: 아래 backend를 github로 바꿀 수 있음 (repo: sigyeol2024/sigyeol, branch: main)
#
# 카테고리별 컬렉션: 모두 content/poems/ 에 JSON을 두고 category 필드로 필터합니다.
# /admin 사이드바에 신작시 · 주목한 시 · 신인상 · 공지사항이 각각 보입니다.

backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: static/media
public_folder: /static/media

# 바로 발행 (editorial workflow 끔)

# 공통 필드 (YAML anchors) — 카테고리 hidden default만 컬렉션마다 다름
x-field-id: &field_id
  label: ID
  name: id
  widget: number
  value_type: int
  hint: "새 글은 브라우저 콘솔에서 Date.now() 값을 넣어 주세요. (파일명·고유키용; 표시 순서는 아래 '표시 순서' 필드를 씁니다.)"

x-field-order: &field_order
  label: "표시 순서 — 작을수록 위. 사이에 넣으려면 55.5처럼 소수 가능."
  name: order
  widget: number
  value_type: float
  step: 0.1
  required: false
  hint: "작을수록 위. 비워 두고 Publish하면 해당 카테고리 최솟값−1이 자동으로 들어가 맨 위에 옵니다. 55와 56 사이는 55.5처럼 소수를 쓰세요. 같은 숫자면 ID가 큰 글이 위입니다."

x-field-title: &field_title
  label: 제목
  name: title
  widget: string

x-field-author: &field_author
  label: 작가명
  name: author
  widget: string
  default: ""

x-field-ismain: &field_ismain
  label: 메인 페이지 노출
  name: isMain
  widget: boolean
  default: false

x-field-mainorder: &field_mainorder
  label: "메인 페이지 노출 순서"
  name: mainOrder
  widget: number
  value_type: float
  step: 0.1
  required: false
  hint: "작을수록 메인 목록 위쪽. 비워 두면 표시 순서를 따름 (값이 있는 글이 먼저, 빈 글은 그 뒤). 1.5처럼 소수 가능."

x-field-content: &field_content
  label: 본문
  name: content
  widget: poem-html
  hint: "도구모음: 굵게·기울임·밑줄·취소선·좌/중/우 정렬. Enter로 줄바꿈, 빈 줄은 Enter를 한 번 더. HTML로 저장됩니다."

collections:
  - name: poems_new
    label: 신작시
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}}"
    sortable_fields: ["order", "id", "title", "author"]
    filter:
      field: category
      value: 신작시
    fields:
      - *field_id
      - *field_order
      - label: 카테고리
        name: category
        widget: hidden
        default: 신작시
      - *field_title
      - *field_author
      - *field_ismain
      - *field_mainorder
      - *field_content

  - name: poems_spotlight
    label: 주목한 시
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}}"
    sortable_fields: ["order", "id", "title", "author"]
    filter:
      field: category
      value: 주목한 시
    fields:
      - *field_id
      - *field_order
      - label: 카테고리
        name: category
        widget: hidden
        default: 주목한 시
      - *field_title
      - *field_author
      - *field_ismain
      - *field_mainorder
      - *field_content

  - name: poems_rookie
    label: 신인상
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}}"
    sortable_fields: ["order", "id", "title", "author"]
    filter:
      field: category
      value: 신인상
    fields:
      - *field_id
      - *field_order
      - label: 카테고리
        name: category
        widget: hidden
        default: 신인상
      - *field_title
      - *field_author
      - *field_ismain
      - *field_mainorder
      - *field_content

  - name: poems_notice
    label: 공지사항
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}}"
    sortable_fields: ["order", "id", "title", "author"]
    filter:
      field: category
      value: 공지사항
    fields:
      - *field_id
      - *field_order
      - label: 카테고리
        name: category
        widget: hidden
        default: 공지사항
      - *field_title
      - *field_author
      - *field_ismain
      - *field_mainorder
      - *field_content
