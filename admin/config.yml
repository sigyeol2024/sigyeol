# Decap CMS — 시결 (sigyeol.com)
# 로그인: Netlify Identity + Git Gateway (Netlify 대시보드에서 활성화 필요)
# 대안: 아래 backend를 github로 바꿀 수 있음 (repo: sigyeol2024/sigyeol, branch: main)
#
# 카테고리별 컬렉션: 모두 content/poems/ 에 JSON을 두고 category 필드로 필터합니다.
# /admin 사이드바에 신작시 · 신인상 · 공지사항이 각각 보입니다.

backend:
  name: git-gateway
  branch: main
  # 커밋 메시지 (발행 표시 '[배포]'를 넣지 않음 → 저장만으로는 배포되지 않음)
  commit_messages:
    create: "새 글 {{collection}} “{{slug}}”"
    update: "수정 {{collection}} “{{slug}}”"
    delete: "삭제 {{collection}} “{{slug}}”"
    uploadMedia: "이미지 올림 “{{path}}”"
    deleteMedia: "이미지 삭제 “{{path}}”"

# 관리 화면 한국어 (Decap 내장 ko 로케일 + admin/ko-overrides.js)
locale: "ko"

local_backend: false

media_folder: static/media
public_folder: /static/media

# 편집 워크플로우 끔: "저장"하면 바로 main에 커밋됩니다.
# 단, 사이트 배포는 '사이트 발행'에서 발행 요청을 저장할 때만 일어납니다 (netlify.toml ignore).

# 공통 필드 (YAML anchors) — 카테고리 hidden default만 컬렉션마다 다름
x-field-id: &field_id
  label: 고유번호
  name: id
  widget: number
  value_type: int
  hint: "새 글은 브라우저 콘솔에서 Date.now() 값을 넣어 주세요. (파일 이름·고유키용 숫자이며, 화면 순서는 아래 '표시 순서'로 정합니다.)"

x-field-order: &field_order
  label: "표시 순서 (카테고리 페이지) — 작을수록 위. 사이에 넣으려면 55.5처럼 소수 가능."
  name: order
  widget: number
  value_type: float
  step: 0.1
  required: false
  hint: "카테고리 페이지(신작시·신인상·공지사항) 목록 순서만 정합니다. 메인 페이지 목록에는 영향이 없습니다. 작을수록 위. 비워 두고 저장하면 해당 카테고리 최솟값−1이 자동으로 들어가 맨 위에 옵니다. 55와 56 사이는 55.5처럼 소수를 쓰세요. 같은 숫자면 고유번호가 큰 글이 위입니다."

x-field-title: &field_title
  label: 제목
  name: title
  widget: string

x-field-author: &field_author
  label: 작가명
  name: author
  widget: string
  default: ""

x-field-ismain: &field_ismain
  label: 메인 페이지 노출
  name: isMain
  widget: boolean
  default: false

x-field-mainorder: &field_mainorder
  label: "메인 페이지 노출 순서 (메인 목록 전용) — 작을수록 위"
  name: mainOrder
  widget: number
  value_type: float
  step: 0.1
  required: false
  hint: "메인 페이지 오른쪽 목록의 순서만 정합니다(카테고리의 '표시 순서'와 완전히 별개). 작을수록 위. '메인 페이지 노출'을 켜고 이 칸을 비워 두고 저장하면, 메인에 노출 중인 글들의 최솟값−1이 자동으로 들어가 메인 목록 맨 위에 옵니다(없으면 1). 직접 넣은 값은 그대로 둡니다. 두 글 사이는 1.5처럼 소수 가능. 같은 숫자면 고유번호가 큰(최근) 글이 위입니다."

x-field-content: &field_content
  label: 본문
  name: content
  widget: poem-html
  hint: "도구모음: 굵게·기울임·밑줄·취소선·글자 크기(작은 가/큰 가/기본, 7단계 — 선택한 글자 또는 커서가 있는 줄)·좌/중/우 정렬. Enter로 줄바꿈, 빈 줄은 Enter를 한 번 더. HTML로 저장됩니다."

collections:
  - name: site_publish
    label: 사이트 발행
    label_singular: 발행 요청
    description: "저장한 글들을 사이트(sigyeol.com)에 한 번에 내보냅니다. ① 발행 요청 열기 → ② '발행 요청하기' → ③ 맨 위 '저장'. 발행 1번 = Netlify 배포 1번(15크레딧)."
    create: false
    delete: false
    editor:
      preview: false
    files:
      - name: publish
        label: 발행 요청
        file: content/publish.json
        format: json
        fields:
          - label: 발행 요청
            name: requestedAt
            widget: publish-request
          - label: 메모
            name: memo
            widget: string
            required: false
            hint: "무엇을 발행하는지 적어 두면 나중에 기록을 보기 편합니다."

  - name: site_settings
    label: 호 설정
    label_singular: 호 설정
    description: "메인 페이지 오른쪽 목록 맨 위에 보이는 이번 호 제목(예: 2026 겨울호)을 정합니다. 저장만으로는 사이트에 나가지 않으며, '사이트 발행'을 할 때 함께 반영됩니다."
    create: false
    delete: false
    editor:
      preview: false
    files:
      - name: issue
        label: 이번 호 표시
        file: content/site.json
        format: json
        fields:
          - label: 표시
            name: showIssue
            widget: boolean
            default: true
            hint: "끄면 메인 목록 위의 호 제목을 숨깁니다(값은 그대로 남습니다)."
          - label: 호 제목
            name: issueTitle
            widget: string
            hint: "메인 목록 맨 위에 크게 보입니다. 예: 2026 겨울호"
          - label: 보조 문구
            name: issueSubtitle
            widget: string
            required: false
            hint: "호 제목 아래 작은 글씨 한 줄(선택). 예: 통권 제3호 · 2026년 12월"

  - name: poems_new
    label: 신작시
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}}"
    sortable_fields: ["order", "id", "title", "author"]
    filter:
      field: category
      value: 신작시
    fields:
      - *field_id
      - *field_order
      - label: 카테고리
        name: category
        widget: hidden
        default: 신작시
      - *field_title
      - *field_author
      - *field_ismain
      - *field_mainorder
      - *field_content

  - name: poems_rookie
    label: 신인상
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}}"
    sortable_fields: ["order", "id", "title", "author"]
    filter:
      field: category
      value: 신인상
    fields:
      - *field_id
      - *field_order
      - label: 카테고리
        name: category
        widget: hidden
        default: 신인상
      - *field_title
      - *field_author
      - *field_ismain
      - *field_mainorder
      - *field_content

  - name: poems_notice
    label: 공지사항
    label_singular: 글
    folder: content/poems
    create: true
    delete: true
    slug: "{{id}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{order}} · {{title}} — {{author}}"
    sortable_fields: ["order", "id", "title", "author"]
    filter:
      field: category
      value: 공지사항
    fields:
      - *field_id
      - *field_order
      - label: 카테고리
        name: category
        widget: hidden
        default: 공지사항
      - *field_title
      - *field_author
      - *field_ismain
      - *field_mainorder
      - *field_content
